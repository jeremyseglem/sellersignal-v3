name: Maricopa Recorder Harvester

on:
  schedule:
    # Daily at 14:00 UTC (7am Phoenix). 14-day lookback makes missed runs
    # self-healing.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Write to DB (1) or dry run (0)"
        required: false
        default: "0"
      days:
        description: "Lookback window in days"
        required: false
        default: "14"
      codes:
        description: "Comma list of doc codes"
        required: false
        default: "PD"
      resolve_backfill:
        description: "1 = re-OCR existing recordings to backfill resolved_parcels"
        required: false
        default: "0"
      capture:
        description: "1 = capture mode: dump raw OCR text for CODES (no roll, no write)"
        required: false
        default: "0"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install Python dependencies
        run: pip install requests

      - name: Week key for roll cache
        id: wk
        if: github.event.inputs.capture != '1'
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Maricopa county owner roll (refreshed weekly)
        id: roll-cache
        if: github.event.inputs.capture != '1'
        uses: actions/cache@v4
        with:
          path: /tmp/maricopa-roll.csv.gz
          key: maricopa-roll-${{ steps.wk.outputs.week }}
      - name: Build Maricopa county owner roll (county-wide inversion)
        if: github.event.inputs.capture != '1' && steps.roll-cache.outputs.cache-hit != 'true'
        run: OUT=/tmp/maricopa-roll.csv.gz python3 scripts/build_maricopa_county_roll.py
      - name: Run harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.write }}
          DAYS: ${{ github.event_name == 'schedule' && '14' || github.event.inputs.days }}
          CODES: ${{ github.event_name == 'schedule' && 'PD' || github.event.inputs.codes }}
          MARICOPA_ROLL: /tmp/maricopa-roll.csv.gz
          RESOLVE_BACKFILL: ${{ github.event.inputs.resolve_backfill || '0' }}
          CAPTURE: ${{ github.event.inputs.capture || '0' }}
        run: python3 scripts/run_maricopa_recorder.py
