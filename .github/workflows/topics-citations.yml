name: TOPICs Citations

# Harvests Texas statewide probate citations from the OCA's TOPICs feed
# (topics.txcourts.gov/CitationsPublic) and writes probate signals to
# raw_signals_v3 for counties with live markets (COUNTY_MARKETS in
# backend/harvesters/topics_citations.py). Plain HTTP + pypdf — no browser.
#
# Default is a DRY RUN. The daily cron passes write=1.

on:
  workflow_dispatch:
    inputs:
      write:
        description: "1 to write to DB, 0 for dry run"
        required: false
        default: "0"
      since_days:
        description: "lookback window in days"
        required: false
        default: "7"
  schedule:
    # 8:00am America/Chicago, after the prior day's citations post. 14:00 UTC.
    - cron: "0 14 * * *"

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pypdf
      - name: Week key for DCAD cache
        id: wk
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache DCAD bulk roll (refreshed weekly)
        id: dcad-cache
        uses: actions/cache@v4
        with:
          path: /tmp/dcad2026.zip
          key: dcad-current-${{ steps.wk.outputs.week }}
      - name: Download DCAD bulk roll (county-wide decedent resolution)
        if: steps.dcad-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 1500 --retry 3 --retry-delay 10 -C - \
            -A "Mozilla/5.0" \
            "https://www.dallascad.org/ViewPDFs.aspx?type=3&id=%5C%5CDCAD.ORG%5CWEB%5CWEBDATA%5CWEBFORMS%5CDATA%20PRODUCTS%5CDCAD2026_CURRENT.ZIP" \
            -o /tmp/dcad2026.zip
          ls -la /tmp/dcad2026.zip
      - name: Cache TCAD appraisal roll (refreshed weekly)
        id: tcad-cache
        uses: actions/cache@v4
        with:
          path: /tmp/tcad-roll.zip
          key: tcad-roll-${{ steps.wk.outputs.week }}
      - name: Download TCAD appraisal roll (Travis county-wide resolution)
        if: steps.tcad-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL --max-time 1500 --retry 3 --retry-delay 10 -C - \
            -A "Mozilla/5.0" \
            "https://github.com/jeremyseglem/sellersignal-v3/releases/download/data-tcad-2026/tcad-roll-2026.zip" \
            -o /tmp/tcad-roll.zip
          ls -la /tmp/tcad-roll.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/tcad-roll.zip').namelist()" \
            || { echo "::error::TCAD roll download is not a valid zip"; rm -f /tmp/tcad-roll.zip; exit 1; }
      - name: Cache Collin county owner roll (refreshed weekly)
        id: collin-roll-cache
        uses: actions/cache@v4
        with:
          path: /tmp/collin-roll.csv.gz
          key: collin-roll-${{ steps.wk.outputs.week }}
      - name: Build Collin county owner roll
        if: steps.collin-roll-cache.outputs.cache-hit != 'true'
        run: OUT=/tmp/collin-roll.csv.gz python3 scripts/build_collin_county_roll.py
      - name: Run TOPICs citations harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WRITE: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.write }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '7' }}
          DCAD_ZIP: /tmp/dcad2026.zip
          TCAD_ROLL: /tmp/tcad-roll.zip
          COLLIN_ROLL: /tmp/collin-roll.csv.gz
        run: python -u scripts/run_topics_citations.py
