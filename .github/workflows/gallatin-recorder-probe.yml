name: Gallatin Recorder Probe (manual diagnostic — safe to ignore failures)

# DIAGNOSTIC ONLY. Manual dispatch, read-only, writes nothing.
# Gallatin County MT recorded documents live on Tyler EagleWeb at
# eagleweb.gallatin.mt.gov/recorder/web/. The host is unreachable from the
# Claude sandbox AND the proxied laptop shell (port 443 filtered —
# gov firewall likely blocks datacenter/proxy egress, verified 2026-10-16).
# This probe answers: (1) can a GitHub Actions runner reach it, (2) is there
# guest access, (3) what do the search form and result rows look like.
# Artifacts feed the parser build for the deed-transfer harvester (the fast
# leg of lead retirement) — never invent field names.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Raw reachability
        continue-on-error: true
        run: |
          curl -sv -m 25 "https://eagleweb.gallatin.mt.gov/recorder/web/" -o /tmp/raw.html 2>&1 | grep -E "Connected to|HTTP/|subject:|error" | head -10 || true
          echo "--- raw bytes: $(wc -c < /tmp/raw.html 2>/dev/null || echo 0)"
          head -c 600 /tmp/raw.html 2>/dev/null || true
      - name: Probe EagleWeb under real Chromium
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json, pathlib

          BASE = "https://eagleweb.gallatin.mt.gov/recorder/web/"
          OUT = pathlib.Path("eagleprobe"); OUT.mkdir(exist_ok=True)

          def dump(page, name):
              (OUT / f"{name}.html").write_text(page.content())
              page.screenshot(path=str(OUT / f"{name}.png"), full_page=True)
              print(f"[dump] {name}: url={page.url[:120]} title={page.title()[:80]!r}")

          def links(page, label, n=50):
              out = page.evaluate("""() => Array.from(document.querySelectorAll('a,input[type=button],input[type=submit],button'))
                  .map(a => ({tag: a.tagName, href: a.getAttribute('href'), onclick: (a.getAttribute('onclick')||'').slice(0,80),
                              text: (a.innerText||a.value||'').trim().slice(0,60)}))
                  .filter(l => l.text || l.href)""")
              print(f"=== clickables on {label} ({len(out)}) ===")
              for l in out[:n]: print(json.dumps(l))
              return out

          def forms(page, label):
              out = page.evaluate("""() => Array.from(document.querySelectorAll('form')).map(f => ({
                  name: f.getAttribute('name'), id: f.id||null, action: f.getAttribute('action'), method: f.getAttribute('method'),
                  fields: Array.from(f.querySelectorAll('input,select,textarea')).map(el => ({
                      tag: el.tagName, name: el.getAttribute('name'), type: el.getAttribute('type'),
                      id: el.id||null, value: (el.value||'').slice(0,40),
                      options: el.tagName==='SELECT' ? Array.from(el.options).slice(0,80).map(o=>o.value+' | '+o.text.trim().slice(0,50)) : undefined
                  })).slice(0,80)}))""")
              print(f"=== forms on {label} ===")
              print(json.dumps(out, indent=1)[:12000])
              return out

          with sync_playwright() as p:
              br = p.chromium.launch(headless=True,
                  args=["--disable-blink-features=AutomationControlled"])
              ctx = br.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width": 1366, "height": 900}, locale="en-US",
                  ignore_https_errors=True)
              page = ctx.new_page()
              try:
                  page.goto(BASE, wait_until="domcontentloaded", timeout=90000)
              except Exception as e:
                  print("goto raised:", e)
              time.sleep(4)
              dump(page, "01_landing")
              links(page, "landing"); forms(page, "landing")

              # Guest access: EagleWeb installs expose a "Login as Guest" /
              # "Public Login" control on login.jsp. Find and click anything
              # guest-ish; otherwise try login.jsp directly.
              body = page.evaluate("() => (document.body && document.body.innerText || '')")
              if 'guest' not in body.lower():
                  try:
                      page.goto(BASE + "login.jsp", wait_until="domcontentloaded", timeout=60000)
                      time.sleep(3)
                      dump(page, "02_login")
                      links(page, "login"); forms(page, "login")
                  except Exception as e:
                      print("login.jsp raised:", e)
              clicked = False
              for sel in ["input[value*='uest']", "a:has-text('Guest')", "button:has-text('Guest')",
                          "input[name='guest']", "a:has-text('Public')", "input[value*='ublic']"]:
                  try:
                      el = page.locator(sel).first
                      if el.count() > 0:
                          el.click(timeout=5000); clicked = True
                          print(f"clicked guest control: {sel}")
                          break
                  except Exception:
                      continue
              if clicked:
                  try: page.wait_for_load_state("domcontentloaded")
                  except Exception: pass
                  time.sleep(4)
              dump(page, "03_post_login")
              links(page, "post-login"); forms(page, "post-login")

              # Find the document search page. Common EagleWeb paths:
              for path in ("searchIndex.jsp", "search.jsp", "docSearch.jsp", "searchDocs.jsp"):
                  try:
                      page.goto(BASE + path, wait_until="domcontentloaded", timeout=45000)
                      time.sleep(3)
                      t = page.title() or ''
                      b = page.evaluate("() => (document.body && document.body.innerText || '').slice(0,200)")
                      print(f"try {path}: title={t!r} body[:120]={b[:120]!r}")
                      if 'error' not in t.lower() and len(b) > 50:
                          dump(page, f"04_{path.replace('.jsp','')}")
                          forms(page, path)
                          break
                  except Exception as e:
                      print(f"{path} raised: {e}")
              br.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eagle-probe
          path: eagleprobe/
          if-no-files-found: ignore
