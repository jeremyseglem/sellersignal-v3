name: MT Browser Probe (manual diagnostic — safe to ignore failures)

# DIAGNOSTIC ONLY. Manual dispatch, read-only, writes nothing.
# The MT District Court portal (FullCourt Enterprise) sits behind F5 TSPD
# bot defense: plain requests get a JS challenge from BOTH the Claude
# sandbox AND Railway (verified 2026-07-24 via /api/harvest/diag/mt-portal).
# This probe answers: does real Chromium in GitHub Actions clear TSPD, and
# what do the court picker / Judgment Order Index Search / case detail
# pages actually look like? Artifacts feed the parser build in
# backend/harvesters/mt_district_court.py — never invent field names.

on:
  workflow_dispatch:

jobs:
  browserprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe FullCourt portal under real Chromium
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json, pathlib

          START = "https://dcportal.pubcourts.mt.gov/fullcourtweb/start.do"
          OUT = pathlib.Path("mtprobe"); OUT.mkdir(exist_ok=True)

          def dump(page, name):
              (OUT / f"{name}.html").write_text(page.content())
              page.screenshot(path=str(OUT / f"{name}.png"), full_page=True)
              print(f"[dump] {name}: url={page.url[:120]} title={page.title()[:80]!r}")

          def links(page, label):
              out = page.evaluate("""() => Array.from(document.querySelectorAll('a'))
                  .map(a => ({href: a.getAttribute('href'), text: (a.innerText||'').trim().slice(0,60)}))
                  .filter(l => l.text)""")
              print(f"=== links on {label} ({len(out)}) ===")
              for l in out[:40]: print(json.dumps(l))
              return out

          def forms(page, label):
              out = page.evaluate("""() => Array.from(document.querySelectorAll('form')).map(f => ({
                  name: f.getAttribute('name'), action: f.getAttribute('action'),
                  fields: Array.from(f.querySelectorAll('input,select,textarea'))
                      .map(el => ({tag: el.tagName, name: el.getAttribute('name'),
                                   type: el.getAttribute('type'), id: el.id||null})).slice(0,40)}))""")
              print(f"=== forms on {label} ===")
              print(json.dumps(out, indent=1)[:4000])
              return out

          with sync_playwright() as p:
              br = p.chromium.launch(headless=True,
                  args=["--disable-blink-features=AutomationControlled"])
              ctx = br.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width": 1366, "height": 900}, locale="en-US")
              page = ctx.new_page()
              # TSPD tar-pits the initial navigation: don't wait for
              # domcontentloaded (times out at 60s) — take the commit and
              # let the challenge JS churn while we poll.
              try:
                  page.goto(START, wait_until="commit", timeout=120000)
              except Exception as e:
                  print("goto(commit) raised:", e)
              # TSPD challenge resolves via JS then reloads — give it time.
              for t in range(12):
                  time.sleep(5)
                  body = page.evaluate("() => (document.body && document.body.innerText || '').slice(0, 300)")
                  title = page.title()
                  print(f"t+{(t+1)*5}s title={title!r} body[:120]={body[:120]!r}")
                  if title or len(body) > 100:
                      break
              dump(page, "01_landing")
              links(page, "landing")
              forms(page, "landing")

              # Tenant login: the "login" form is just a court select
              # (name=tenant) + hidden loginAction submit — no credentials.
              # Verified from the 01_landing capture (option value equals the
              # display name, e.g. 'Gallatin District Court').
              page.select_option("select#tenant", "Gallatin District Court")
              time.sleep(1)
              page.evaluate("""() => {
                  const f = document.forms['loginForm'];
                  const b = f.querySelector("input[name='loginAction']");
                  if (b) b.click(); else f.submit(); }""")
              page.wait_for_load_state("domcontentloaded"); time.sleep(6)
              dump(page, "02_gallatin_portal")
              links(page, "gallatin-portal")
              forms(page, "gallatin-portal")

              BASE = "https://dcportal.pubcourts.mt.gov/fullcourtweb"

              # DP case enumeration: formatCaseType/Year/Number + hidden
              # retrieveAction submit (field names from 06_civil_case_lookup
              # capture). Walk candidate sequence numbers until a real case
              # renders, then dump it with litigants shown.
              def lookup(case_num):
                  page.goto(f"{BASE}/civilCase.do?CourtCaseId=0",
                            wait_until="domcontentloaded", timeout=60000)
                  time.sleep(3)
                  page.evaluate("""(n) => {
                      const f = document.forms['civilCaseForm'];
                      f.querySelector("input[name='formatCaseType']").value = 'DP';
                      f.querySelector("input[name='formatCaseYear']").value = '2026';
                      f.querySelector("input[name='formatCaseNumber']").value = n;
                      const lit = f.querySelector("input[name='reportBean.showLitigants'][type='checkbox']");
                      if (lit && !lit.checked) lit.click();
                      const b = f.querySelector("input[name='retrieveAction']");
                      b.click(); }""", case_num)
                  page.wait_for_load_state("domcontentloaded"); time.sleep(5)
                  body = page.evaluate("() => (document.body.innerText||'').slice(0,400)")
                  found = ('DP-' in body or 'Probate' in body or 'Estate' in body) and 'not found' not in body.lower()
                  print(f"lookup DP-2026-{case_num}: url={page.url[:90]} found={found} body[:150]={body[:150]!r}")
                  return found

              hit = None
              for n in ("0000010", "0000050", "0000100", "0000150", "0000200", "0000025"):
                  try:
                      if lookup(n):
                          hit = n
                          break
                  except Exception as e:
                      print(f"lookup {n} raised: {e}")
              if hit:
                  dump(page, "07_dp_case_detail")
                  tables = page.evaluate("""() => Array.from(document.querySelectorAll('table'))
                      .map(t => Array.from(t.querySelectorAll('tr')).slice(0, 15)
                      .map(tr => Array.from(tr.querySelectorAll('td,th'))
                      .map(td => (td.innerText||'').trim().slice(0,40))))""")
                  print("=== DP case tables ==="); print(json.dumps(tables, indent=1)[:6000])
              else:
                  dump(page, "07_dp_lookup_miss")

              br.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mt-probe
          path: mtprobe/
          if-no-files-found: ignore
