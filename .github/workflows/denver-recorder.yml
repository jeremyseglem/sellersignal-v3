name: Denver Recorder

# Harvests Denver County recorded death/estate instruments (Personal
# Representative's/Executor's/Administrator's Deed, Deed of Distribution,
# Beneficiary Deed/TOD, Death Certificate) from denver.co.publicsearch.us
# (publicsearch.us/neumo platform — reuses the shared dallas_recorder.py grid
# driver + parser) and writes probate signals to raw_signals_v3
# (source_type=co_denver_recorder).
#
# ⚠️ NOT YET VALIDATED LIVE. The tenant + search form are confirmed, but the
# results grid would not render from the build sandbox's datacenter IP (same
# edge gate dallas_recorder.py documents; the Actions runner clears it). FIRST
# run this workflow MANUALLY with write=0 (dry run) and confirm the log shows
# real parsed sample signals BEFORE enabling the schedule / write=1.
#
# Default is a DRY RUN. Secrets SUPABASE_URL + SUPABASE_SERVICE_KEY required.

on:
  workflow_dispatch:
    inputs:
      write:
        description: "1 to write to DB, 0 for dry run"
        required: false
        default: "0"
      days:
        description: "lookback window in days"
        required: false
        default: "7"
      chunk_days:
        description: "sub-window size in days"
        required: false
        default: "1"
  # Schedule intentionally left DISABLED until a dry run validates row
  # extraction in the Actions runner. Uncomment to enable the daily cron.
  # schedule:
  #   - cron: "20 14 * * *"   # 8:20am America/Denver, offset from other crons

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Run Denver recorder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Manual dispatch only for now; input default is dry-run (0).
          WRITE: ${{ github.event.inputs.write || '0' }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '1' }}
        run: python scripts/run_denver_recorder.py
