name: TX Browser Probe

on:
  workflow_dispatch:

jobs:
  browserprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe what enables Travis Search
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time
          HOME = "https://travis.tx.publicsearch.us/"
          def btn(page):
              b=(page.query_selector("button[aria-label='Search']")
                 or page.query_selector("button[type='submit']")
                 or page.query_selector("button:has-text('Search')"))
              if not b: return "NO BUTTON"
              return (f"disabled={b.get_attribute('disabled')} "
                      f"aria-disabled={b.get_attribute('aria-disabled')} "
                      f"cls={(b.get_attribute('class') or '')[:50]}")
          def results(page,label):
              body=page.content()
              rows=page.query_selector_all(".tableRow, table tbody tr, [data-tourid='searchResults'] .tableRow")
              print(f"[{label}] url={page.url[:120]}")
              print(f"[{label}] rows={len(rows)} no_results={'No results' in body or 'no results' in body.lower()}")
          with sync_playwright() as p:
              br=p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
              ctx=br.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":900},locale="en-US")
              page=ctx.new_page()
              page.goto(HOME,wait_until="domcontentloaded",timeout=60000)
              time.sleep(8)
              for s in ("button[aria-label='Close']","button[aria-label='Dismiss announcement']"):
                  e=page.query_selector(s)
                  if e:
                      try: e.click(); time.sleep(1)
                      except Exception: pass
              print("STATE initial:", btn(page))
              tog=page.query_selector("#date-range-select")
              try: tog.click(force=True,timeout=5000)
              except Exception: page.evaluate("e=>e.click()",tog)
              time.sleep(1.5)
              opt=page.query_selector("#date-range-select-listbox-option-3")
              try: opt.click(timeout=5000)
              except Exception: page.evaluate("e=>e.click()",opt)
              time.sleep(1.5)
              print("STATE after preset:", btn(page))
              # dump every text input's live attributes (id may have shifted)
              inputs=page.evaluate("""() => Array.from(document.querySelectorAll('input')).map(el=>({
                  id:el.id||null,name:el.getAttribute('name'),type:el.getAttribute('type'),
                  placeholder:el.getAttribute('placeholder'),aria:el.getAttribute('aria-label'),
                  disabled:el.disabled,readonly:el.readOnly,
                  cls:(el.className&&el.className.toString().slice(0,60))||null,
                  vis:!!(el.offsetWidth||el.offsetHeight)}))""")
              import json
              print("=== INPUTS ===")
              for i in inputs: print(json.dumps(i))
              kb=(page.query_selector("#basicSearchInputBox")
                  or page.query_selector("input[placeholder*='doc type' i]")
                  or page.query_selector("input[type='text']:not([disabled])"))
              print("keyword box found:", bool(kb))
              if kb:
                  try:
                      kb.click(timeout=5000); page.keyboard.type("AFFIDAVIT OF DEATH", delay=40)
                      print("typed via keyboard")
                  except Exception as e:
                      print("type failed:", type(e).__name__, e)
                  time.sleep(1.5)
              print("STATE after doctype keyword:", btn(page))
              sb=(page.query_selector("button[aria-label='Search']")
                  or page.query_selector("button:has-text('Search')"))
              try: sb.click(timeout=6000)
              except Exception:
                  try: sb.click(force=True,timeout=6000)
                  except Exception: kb.press("Enter")
              time.sleep(9)
              try: page.wait_for_load_state("networkidle",timeout=12000)
              except Exception: pass
              results(page,"doctype search")
              page.screenshot(path="travis_submit.png",full_page=True)
              br.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travis-submit
          path: travis_submit.png
          if-no-files-found: ignore
