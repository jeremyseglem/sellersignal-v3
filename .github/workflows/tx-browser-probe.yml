name: TX Browser Probe

on:
  workflow_dispatch:

jobs:
  browserprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe what enables Travis Search
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time
          HOME = "https://travis.tx.publicsearch.us/"
          def btn(page):
              b=(page.query_selector("button[aria-label='Search']")
                 or page.query_selector("button[type='submit']")
                 or page.query_selector("button:has-text('Search')"))
              if not b: return "NO BUTTON"
              return (f"disabled={b.get_attribute('disabled')} "
                      f"aria-disabled={b.get_attribute('aria-disabled')} "
                      f"cls={(b.get_attribute('class') or '')[:50]}")
          def results(page,label):
              body=page.content()
              rows=page.query_selector_all(".tableRow, table tbody tr, [data-tourid='searchResults'] .tableRow")
              print(f"[{label}] url={page.url[:120]}")
              print(f"[{label}] rows={len(rows)} no_results={'No results' in body or 'no results' in body.lower()}")
          with sync_playwright() as p:
              br=p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
              ctx=br.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":900},locale="en-US")
              page=ctx.new_page()
              page.goto(HOME,wait_until="domcontentloaded",timeout=60000)
              time.sleep(8)
              for s in ("button[aria-label='Close']","button[aria-label='Dismiss announcement']"):
                  e=page.query_selector(s)
                  if e:
                      try: e.click(); time.sleep(1)
                      except Exception: pass
              print("STATE initial:", btn(page))
              # THE GATE: basicSearchInputBox is disabled until a DEPARTMENT
              # is chosen. Open the react-select and dump its options.
              dept = page.query_selector("#react-select-282-input") or page.query_selector("[aria-label='Change department']")
              print("dept control found:", bool(dept))
              if dept:
                  try: dept.click(timeout=5000)
                  except Exception: page.evaluate("e=>e.click()",dept)
                  time.sleep(2)
                  opts=page.evaluate("""() => Array.from(document.querySelectorAll('[role=option],[id*=react-select][id*=option]')).map(el=>({
                      id:el.id||null,text:(el.innerText||'').trim().slice(0,40)}))""")
                  import json
                  print("=== DEPARTMENT OPTIONS ===")
                  for o in opts: print(json.dumps(o))
                  # pick Real Property / Official Public Records
                  picked=None
                  for want in ("Real Property","Official Public Records","Land Records","All"):
                      el=page.query_selector(f"[role=option]:has-text('{want}')")
                      if el:
                          try:
                              el.click(timeout=4000); picked=want
                          except Exception:
                              page.evaluate("e=>e.click()",el); picked=want
                          break
                  print("picked department:", picked)
                  time.sleep(2)
              print("STATE after department:", btn(page))
              kbs=page.evaluate("""() => {const el=document.querySelector('#basicSearchInputBox');
                  return el?{disabled:el.disabled,placeholder:el.getAttribute('placeholder')}:null}""")
              print("keyword box now:", kbs)
              kb=page.query_selector("#basicSearchInputBox")
              if kb and kbs and not kbs.get("disabled"):
                  try:
                      kb.click(timeout=5000); page.keyboard.type("AFFIDAVIT OF DEATH",delay=40)
                      print("typed doctype")
                  except Exception as e: print("type failed:",type(e).__name__)
                  time.sleep(1)
              # now select date preset
              tog=page.query_selector("#date-range-select")
              if tog:
                  try: tog.click(force=True,timeout=5000)
                  except Exception: page.evaluate("e=>e.click()",tog)
                  time.sleep(1.5)
                  opt=page.query_selector("#date-range-select-listbox-option-3")
                  if opt:
                      try: opt.click(timeout=5000)
                      except Exception: page.evaluate("e=>e.click()",opt)
                      time.sleep(1.5)
              print("STATE final:", btn(page))
              sb=(page.query_selector("button[aria-label='Search']") or page.query_selector("button:has-text('Search')"))
              try: sb.click(timeout=6000)
              except Exception:
                  try: sb.click(force=True,timeout=6000)
                  except Exception:
                      try: page.keyboard.press("Enter")
                      except Exception: pass
              time.sleep(9)
              try: page.wait_for_load_state("networkidle",timeout=12000)
              except Exception: pass
              results(page,"final search")
              page.screenshot(path="travis_submit.png",full_page=True)
              br.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travis-submit
          path: travis_submit.png
          if-no-files-found: ignore
