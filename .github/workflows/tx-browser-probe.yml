name: TX Browser Probe (manual diagnostic — safe to ignore failures)

# DIAGNOSTIC ONLY. Manual dispatch, read-only, writes nothing.
# Used 2026-07-21 to root-cause the Travis recorder (result: the tenant
# soft-blocks automated browsers — see MANIFESTO). Failures here are NOT
# production incidents.

on:
  workflow_dispatch:

jobs:
  browserprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe what enables Travis Search
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time
          HOME = "https://travis.tx.publicsearch.us/"
          def btn(page):
              b=(page.query_selector("button[aria-label='Search']")
                 or page.query_selector("button[type='submit']")
                 or page.query_selector("button:has-text('Search')"))
              if not b: return "NO BUTTON"
              return (f"disabled={b.get_attribute('disabled')} "
                      f"aria-disabled={b.get_attribute('aria-disabled')} "
                      f"cls={(b.get_attribute('class') or '')[:50]}")
          def results(page,label):
              body=page.content()
              rows=page.query_selector_all(".tableRow, table tbody tr, [data-tourid='searchResults'] .tableRow")
              print(f"[{label}] url={page.url[:120]}")
              print(f"[{label}] rows={len(rows)} no_results={'No results' in body or 'no results' in body.lower()}")
          with sync_playwright() as p:
              br=p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
              ctx=br.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":900},locale="en-US")
              page=ctx.new_page()
              page.goto(HOME,wait_until="domcontentloaded",timeout=60000)
              time.sleep(8)
              for s in ("button[aria-label='Close']","button[aria-label='Dismiss announcement']"):
                  e=page.query_selector(s)
                  if e:
                      try: e.click(); time.sleep(1)
                      except Exception: pass
              # Decisive test: is the disabled search box a GATE (needs an
              # action) or just a slow/blocked SPA boot under headless?
              # Poll the box's disabled flag over 60s and watch for bot-check
              # markers.
              for t in (0,5,10,15,20,30,45,60):
                  if t: time.sleep(t - prev if 'prev' in dir() else 5)
                  prev=t
                  st=page.evaluate("""() => {const el=document.querySelector('#basicSearchInputBox');
                      return {disabled: el? el.disabled : 'NO BOX',
                              ready: document.readyState,
                              cf: /challenge|cf-browser|Just a moment/i.test(document.body.innerText||''),
                              loading: /Loading/i.test(document.body.innerText||'')}}""")
                  print(f"t+{t}s: {st} | search_btn: {btn(page)}")
              # try clicking the react-select CONTROL (not the dummy input)
              ctrl=page.query_selector("div[class*='-control']")
              print("react-select control found:", bool(ctrl))
              if ctrl:
                  try: ctrl.click(timeout=5000)
                  except Exception: page.evaluate("e=>e.click()",ctrl)
                  time.sleep(2)
                  opts=page.evaluate("""() => Array.from(document.querySelectorAll('[class*=-option],[role=option]')).map(el=>({
                      id:el.id||null,cls:(el.className||'').toString().slice(0,40),
                      text:(el.innerText||'').trim().slice(0,40)}))""")
                  import json
                  print("=== OPTIONS AFTER CONTROL CLICK ===")
                  for o in opts[:15]: print(json.dumps(o))
                  st2=page.evaluate("""() => {const el=document.querySelector('#basicSearchInputBox'); return el?el.disabled:null}""")
                  print("box disabled after control click:", st2)
              page.screenshot(path="travis_submit.png",full_page=True)
              br.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travis-submit
          path: travis_submit.png
          if-no-files-found: ignore
