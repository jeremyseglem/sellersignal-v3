name: TX Browser Probe

on:
  workflow_dispatch:

jobs:
  browserprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test Travis URL-driven results (does it auto-execute?)
        run: |
          cat > probe.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time
          # Does Travis auto-execute a URL-param search like Dallas does?
          # If the grid renders rows from the URL alone, we can drop UI_DRIVE
          # entirely and fetch results the clean way.
          URL = ("https://travis.tx.publicsearch.us/results?"
                 "department=RP&limit=50&offset=0&"
                 "recordedDateRange=20260701%2C20260715&"
                 "searchOcrText=false&searchType=quickSearch")
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=["--disable-blink-features=AutomationControlled"])
              ctx=b.new_context(user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":900},locale="en-US")
              page=ctx.new_page()
              # capture any XHR the results page fires to the backend API
              seen=[]
              page.on("request", lambda r: seen.append(r.url) if "/api/" in r.url or "search" in r.url.lower() else None)
              print("GOTO", URL)
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              time.sleep(10)
              try: page.wait_for_load_state("networkidle", timeout=15000)
              except Exception: pass
              body=page.content()
              # publicsearch renders result rows as .tableRow / [data-tourid=searchResults]
              rows = page.query_selector_all("[data-tourid='searchResults'] .tableRow, .tableRow, table tbody tr")
              print("TITLE:", page.title())
              print("BODY_LEN:", len(body))
              print("RESULT_ROWS:", len(rows))
              print("HAS_NO_RESULTS_MSG:", ("No results" in body or "no results" in body))
              print("\n--- API/search requests observed ---")
              for u in sorted(set(seen))[:25]:
                  print(" ", u)
              page.screenshot(path="travis_results.png", full_page=True)
              b.close()
          PYEOF
          python probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travis-results
          path: travis_results.png
          if-no-files-found: ignore
