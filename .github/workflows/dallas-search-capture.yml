name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Go straight to a results page for a recent window, then read the
              # Document Type facet links to capture their exact URL param values.
              try:
                  page.goto("https://dallas.tx.publicsearch.us/results?department=RP&recordedDateRange=20260601,20260610&searchType=quickSearch&keywordSearch=false&searchOcrText=false",
                            wait_until="domcontentloaded", timeout=45000)
                  time.sleep(10)
                  try: page.wait_for_load_state("networkidle", timeout=15000)
                  except Exception: pass
                  page.screenshot(path="results.png", full_page=True)
                  print("RESULTS_URL:", page.url)

                  # Enumerate every link href on the results page that carries a
                  # documentTypes / docType param — that reveals the facet codes.
                  hrefs = page.evaluate("""() => Array.from(document.querySelectorAll('a'))
                      .map(a => a.getAttribute('href') || '')
                      .filter(h => /documentType|docType|doc_type/i.test(h))""")
                  print("=== DOCTYPE FACET HREFS ===")
                  for h in hrefs[:60]:
                      print(h)

                  # Also dump the visible Document Type facet labels + the full
                  # left-rail text so we can map label -> code.
                  facet = page.evaluate("""() => {
                      const out = [];
                      document.querySelectorAll('*').forEach(el => {
                          const t = (el.getAttribute && (el.getAttribute('data-doc-type') || el.getAttribute('data-value'))) || '';
                          if (t) out.push(t + ' :: ' + (el.textContent||'').trim().slice(0,40));
                      });
                      return out.slice(0,80);
                  }""")
                  print("=== DATA-ATTR FACETS ===")
                  for f in facet: print(f)

                  txt = page.inner_text("body")[:2000]
                  print("BODY_SNIPPET:", txt.replace("\n"," ")[:1200])
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
