name: Dallas Search Capture

on:
  workflow_dispatch:
    inputs:
      host:
        description: "publicsearch subdomain (dallas | travis | collin)"
        required: false
        default: "dallas"
      keyword:
        description: "search keyword to type (empty = leave box blank)"
        required: false
        default: ""

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://${{ github.event.inputs.host || 'dallas' }}.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # INTERACTIVE SEARCH DRIVE (2026-06-12): Travis + Collin tenants
              # run a frontend that does NOT auto-execute searches from URL
              # params (Dallas does). Drive the real UI: open the search page,
              # fill the recorded-date range, click search, and capture every
              # XHR — revealing either the backing API or the needed flow.
              try:
                  import re as _re, json as _json
                  page.goto(URL, wait_until="domcontentloaded", timeout=45000)
                  time.sleep(6)
                  # dump candidate inputs + buttons for diagnostics
                  els = page.eval_on_selector_all(
                      "input, button, [role=button]",
                      """els => els.slice(0, 60).map(e => ({
                          tag: e.tagName, type: e.type || '', name: e.name || '',
                          id: e.id || '', ph: e.placeholder || '',
                          aria: e.getAttribute('aria-label') || '',
                          txt: (e.innerText || e.value || '').slice(0, 40)
                      }))""")
                  print("=== CANDIDATE CONTROLS ===")
                  for e in els:
                      if any(e.values()):
                          print("  ", _json.dumps(e))
                  # try the date-range inputs (placeholder or aria mentions date)
                  date_inputs = page.query_selector_all(
                      "input[placeholder*='date' i], input[aria-label*='date' i], input[type='date']")
                  print(f"date inputs found: {len(date_inputs)}")
                  # Travis layout: inputs collapsed behind #date-range-select.
                  # Click it (JS dispatch if needed), then dump what appears.
                  if len(date_inputs) == 0:
                      tog = page.query_selector("#date-range-select")
                      print("toggle present:", bool(tog))
                      if tog:
                          for how in ("click", "force", "js"):
                              try:
                                  if how == "click": tog.click(timeout=5000)
                                  elif how == "force": tog.click(force=True, timeout=5000)
                                  else: page.evaluate("el => el.click()", tog)
                                  print("toggle clicked via:", how)
                                  break
                              except Exception as ex:
                                  print(f"toggle {how} failed: {str(ex)[:80]}")
                          time.sleep(3)
                          post = page.eval_on_selector_all(
                              "input, [role=dialog] *, .popover *",
                              """els => els.slice(0, 40).map(e => ({
                                  tag: e.tagName, type: e.type || '',
                                  id: e.id || '', ph: e.placeholder || '',
                                  aria: e.getAttribute && e.getAttribute('aria-label') || '',
                                  cls: (e.className || '').toString().slice(0, 40),
                                  vis: !!(e.offsetWidth || e.offsetHeight)
                              }))""")
                          print("=== POST-TOGGLE CONTROLS ===")
                          for e in post:
                              if e.get("tag") == "INPUT" or e.get("aria"):
                                  print("  ", _json.dumps(e))
                          date_inputs = page.query_selector_all(
                              "input[placeholder*='date' i], input[aria-label*='date' i], input[type='date']")
                          print(f"date inputs after toggle: {len(date_inputs)}")
                          # The popup likely holds PRESET options (no inputs).
                          # Dump its full text + every clickable inside it.
                          pop = page.query_selector("[class*='popup']")
                          if pop:
                              print("=== POPUP TEXT ===")
                              print(pop.inner_text()[:500].replace("\n", " | "))
                              clickables = pop.query_selector_all("button, li, label, a, [role=option], [role=radio]")
                              print(f"popup clickables: {len(clickables)}")
                              for c in clickables[:20]:
                                  try:
                                      print("  ", c.evaluate("e => e.tagName"), "|",
                                            (c.inner_text() or "")[:40], "|",
                                            c.get_attribute("class") or "")
                                  except Exception:
                                      pass
                              # Try selecting a custom-range option if present
                              for needle in ("Custom", "custom", "Date Range", "Specific"):
                                  cand = pop.query_selector(f"text={needle}")
                                  if cand:
                                      try:
                                          cand.click(force=True)
                                          print("clicked popup option:", needle)
                                          time.sleep(2)
                                          break
                                      except Exception as ex:
                                          print("popup option click failed:", str(ex)[:60])
                              date_inputs = page.query_selector_all(
                                  "input[placeholder*='date' i], input[aria-label*='date' i], input[type='date']")
                              print(f"date inputs after popup option: {len(date_inputs)}")
                              allinp = page.eval_on_selector_all("input", """els => els.map(e => ({
                                  id: e.id || '', ph: e.placeholder || '',
                                  aria: e.getAttribute('aria-label') || '', val: (e.value||'').slice(0,12),
                                  vis: !!(e.offsetWidth || e.offsetHeight)}))""")
                              print("ALL INPUTS NOW:")
                              for e in allinp:
                                  if e.get("vis"): print("  ", _json.dumps(e))
                  if len(date_inputs) >= 2:
                      date_inputs[0].fill("06/02/2026")
                      date_inputs[1].fill("06/02/2026")
                  elif len(date_inputs) == 1:
                      date_inputs[0].fill("06/02/2026")
                  # main search box may be required — type a wildcard-ish term
                  kw = "${{ github.event.inputs.keyword }}"
                  main = page.query_selector("input[type='search'], input[placeholder*='search' i]")
                  print("keyword box:", bool(main), "| filling:", repr(kw))
                  if main and kw:
                      main.fill(kw)
                  btn = page.query_selector("button:has-text('Search'), [role=button]:has-text('Search')")
                  print("search button:", bool(btn))
                  if btn:
                      btn.click()
                      time.sleep(10)
                      try: page.wait_for_load_state("networkidle", timeout=12000)
                      except Exception: pass
                  print("FINAL URL:", page.url)
                  body_txt = page.inner_text("body")[:600].replace("\n", " | ")
                  print("PAGE TEXT HEAD:", body_txt)
              except Exception as e:
                  print("interactive err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
