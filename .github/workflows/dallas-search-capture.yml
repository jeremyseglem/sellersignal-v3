name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Discover the real next-page control + confirm clicking advances.
              try:
                  import re as _re
                  base = ("https://dallas.tx.publicsearch.us/results?department=RP"
                          "&recordedDateRange=20260602,20260602&searchType=quickSearch"
                          "&keywordSearch=false&searchOcrText=false")
                  page.goto(base, wait_until="domcontentloaded", timeout=45000)
                  time.sleep(10)
                  try: page.wait_for_load_state("networkidle", timeout=12000)
                  except Exception: pass

                  # dump candidate pager elements with their attributes
                  pager = page.evaluate("""() => {
                      const out=[];
                      document.querySelectorAll('a,button,[role=button],li').forEach(e=>{
                          const t=(e.textContent||'').trim();
                          const al=e.getAttribute('aria-label')||'';
                          const cl=e.className||'';
                          if(/next|▶|»|\\bpage\\b/i.test(t+' '+al+' '+cl) && (t.length<25)){
                              out.push({tag:e.tagName, txt:t, aria:al, cls:String(cl).slice(0,50),
                                        rel:e.getAttribute('rel')||'', disabled:e.disabled||false});
                          }
                      });
                      return out.slice(0,25);
                  }""")
                  print("=== PAGER ELEMENTS ===")
                  for x in pager: print(x)

                  el0 = page.query_selector("table")
                  t0 = (el0.inner_text() if el0 else page.inner_text("body"))
                  d0 = _re.findall(r"\b20\d{10}\b", t0)
                  print("BEFORE first_doc:", d0[0] if d0 else None, "rows~", len(d0))

                  # try clicking ▶
                  clicked=False
                  for sel in ["a[aria-label='Next']","button[aria-label='Next']","[aria-label='Next page']","a[rel='next']","text=▶","text=»"]:
                      e=page.query_selector(sel)
                      if e:
                          try:
                              e.click(); clicked=True; print("CLICKED via", sel); break
                          except Exception as ce:
                              print("click fail",sel,ce)
                  time.sleep(6)
                  try: page.wait_for_load_state("networkidle", timeout=10000)
                  except Exception: pass
                  el1=page.query_selector("table")
                  t1=(el1.inner_text() if el1 else page.inner_text("body"))
                  d1=_re.findall(r"\b20\d{10}\b", t1)
                  print("AFTER  first_doc:", d1[0] if d1 else None, "rows~", len(d1), "advanced=", (d1[0] if d1 else None)!=(d0[0] if d0 else None))
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
