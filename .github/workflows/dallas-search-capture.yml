name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Land on a dense window and inspect pagination controls + how many
              # rows render per page, and whether a page/offset URL param exists.
              try:
                  page.goto("https://dallas.tx.publicsearch.us/results?department=RP&recordedDateRange=20260602,20260602&searchType=quickSearch&keywordSearch=false&searchOcrText=false",
                            wait_until="domcontentloaded", timeout=45000)
                  time.sleep(10)
                  try: page.wait_for_load_state("networkidle", timeout=15000)
                  except Exception: pass
                  print("RESULTS_URL:", page.url)
                  # rows currently in DOM
                  body = page.inner_text("body")
                  import re as _re
                  ndates = len(_re.findall(r"\d{1,2}/\d{1,2}/20\d{2}", body))
                  print("date_cells_in_dom:", ndates)
                  # pagination: capture any element text like "1-25 of 6066" or page buttons
                  for kw in ["of ", "Results", "Page", "Next", "Showing", "per page", "Rows"]:
                      idx = body.find(kw)
                      if idx > 0:
                          print(f"PAGINATION_HINT '{kw}':", body[max(0,idx-40):idx+40].replace(chr(10)," "))
                  # dump anchors / buttons that look like pagination
                  ctrls = page.evaluate("""() => {
                      const out=[];
                      document.querySelectorAll('a,button,[role=button]').forEach(e=>{
                          const t=(e.textContent||'').trim();
                          const al=(e.getAttribute('aria-label')||'');
                          if(/next|prev|page|\\d+\\s*-\\s*\\d+|per page/i.test(t+' '+al) && t.length<40)
                              out.push((t||al)+' :: href='+(e.getAttribute('href')||'')+' data-page='+(e.getAttribute('data-page')||''));
                      });
                      return out.slice(0,40);
                  }""")
                  print("=== PAGINATION CONTROLS ===")
                  for c in ctrls: print(c)
                  # try a results URL with a page/skip param
                  for param in ["page=2", "skip=25", "offset=25", "pageNumber=2", "from=25"]:
                      u2=f"https://dallas.tx.publicsearch.us/results?department=RP&recordedDateRange=20260602,20260602&searchType=quickSearch&keywordSearch=false&searchOcrText=false&{param}"
                      page.goto(u2, wait_until="domcontentloaded", timeout=40000); time.sleep(6)
                      b2=page.inner_text("body")
                      nd2=len(_re.findall(r"\d{1,2}/\d{1,2}/20\d{2}", b2))
                      first=_re.search(r"\d{12}", b2)
                      print(f"PARAM {param}: date_cells={nd2} first_docnum={first.group(0) if first else 'none'}")
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
