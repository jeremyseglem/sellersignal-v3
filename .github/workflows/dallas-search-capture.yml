name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Tally distinct DOC TYPE values across a real window (06/02) so we
              # can see whether estate instruments are present under labels our
              # classifier misses, or whether our row regex mis-parses the column.
              try:
                  import re as _re, collections, json as _json
                  base = ("https://dallas.tx.publicsearch.us/results?department=RP"
                          "&recordedDateRange=20260602,20260602&searchType=quickSearch"
                          "&keywordSearch=false&searchOcrText=false")
                  page.goto(base, wait_until="domcontentloaded", timeout=45000)
                  time.sleep(10)
                  try: page.wait_for_load_state("networkidle", timeout=12000)
                  except Exception: pass

                  doctypes = collections.Counter()
                  sample_rows = []
                  prev_first = None
                  for _ in range(30):
                      el = page.query_selector("table")
                      txt = el.inner_text() if el else page.inner_text("body")
                      docs = _re.findall(r"\b20\d{10}\b", txt)
                      first = docs[0] if docs else None
                      if not first or first == prev_first:
                          break
                      prev_first = first
                      # split table text into rows; the DOC TYPE is the 3rd tab cell
                      for line in txt.split("\n"):
                          cells = line.split("\t")
                          if len(cells) >= 5 and _re.search(r"\b20\d{10}\b", line):
                              # find which cell is the doctype (the one before the date)
                              for ci,c in enumerate(cells):
                                  if _re.match(r"\s*\d{1,2}/\d{1,2}/20\d{2}\s*$", c) and ci>=1:
                                      dt = cells[ci-1].strip()
                                      doctypes[dt]+=1
                                      if len(sample_rows)<6:
                                          sample_rows.append(" | ".join(x.strip() for x in cells[:ci+2]))
                                      break
                      # next page
                      nb = page.query_selector("button[aria-label=\x27next page\x27]")
                      if not nb or nb.get_attribute("disabled") is not None:
                          break
                      nb.click(); time.sleep(4)
                      try: page.wait_for_load_state("networkidle", timeout=8000)
                      except Exception: pass

                  print("=== DISTINCT DOC TYPES (06/02) ===")
                  for dt,ct in doctypes.most_common(60):
                      print(f"{ct:4}  {dt}")
                  print("=== SAMPLE PARSED ROWS ===")
                  for s in sample_rows: print(s[:200])
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
