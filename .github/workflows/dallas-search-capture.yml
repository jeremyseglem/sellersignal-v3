name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Land on a results page, then capture the doc-types list the app
              # uses for filtering + try a keyword search for death instruments.
              try:
                  # capture ALL json-ish responses while we drive the UI
                  page.goto("https://dallas.tx.publicsearch.us/results?department=RP&recordedDateRange=20260601,20260610&searchType=quickSearch&keywordSearch=false&searchOcrText=false",
                            wait_until="domcontentloaded", timeout=45000)
                  time.sleep(10)
                  try: page.wait_for_load_state("networkidle", timeout=15000)
                  except Exception: pass
                  print("RESULTS_URL:", page.url)

                  # Try keyword-search for the estate/death instruments directly via URL.
                  for kw in ["AFFIDAVIT OF DEATH", "PERSONAL REPRESENTATIVE", "EXECUTOR", "TRANSFER ON DEATH"]:
                      enc = kw.replace(" ", "%20")
                      u = ("https://dallas.tx.publicsearch.us/results?department=RP"
                           "&recordedDateRange=20260101,20260610&searchType=quickSearch"
                           f"&keywordSearch=true&searchText={enc}&searchOcrText=false")
                      page.goto(u, wait_until="domcontentloaded", timeout=45000)
                      time.sleep(7)
                      try: page.wait_for_load_state("networkidle", timeout=10000)
                      except Exception: pass
                      body = page.inner_text("body")
                      # count rows by recorded-date pattern
                      import re as _re
                      n = len(_re.findall(r"\d{1,2}/\d{1,2}/20\d{2}", body))
                      head = body.replace("\n"," ")
                      mi = head.find("DOC TYPE")
                      print(f"KW '{kw}': approx_date_cells={n}  grid_head={head[mi:mi+260] if mi>0 else head[:200]}")
                  page.screenshot(path="results.png", full_page=True)
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
