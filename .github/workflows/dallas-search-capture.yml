name: Dallas Search Capture

on:
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drive a search
        run: |
          cat > cap.py << 'PYEOF'
          from playwright.sync_api import sync_playwright
          import time, json

          URL = "https://dallas.tx.publicsearch.us/"
          api_calls = []

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"),
                  viewport={"width":1366,"height":1100}, locale="en-US")
              page = ctx.new_page()

              def on_resp(resp):
                  u = resp.url
                  if "/api/" in u or "search" in u.lower() or "document" in u.lower() or "graphql" in u.lower():
                      if "publicsearch.us/" in u and not any(u.endswith(e) for e in [".css",".js",".svg",".png",".jpg",".woff",".woff2"]):
                          try:
                              body = resp.text()[:1200]
                          except Exception:
                              body = "<binary>"
                          api_calls.append({"status":resp.status,"url":u[:300],"body":body})
              page.on("response", on_resp)

              page.goto(URL, wait_until="domcontentloaded", timeout=45000)
              time.sleep(8)

              # Validate pagination: walk 06/02 (known ~1,296 records) pages 1..5
              # using the EXACT param set, count rows + first doc per page.
              try:
                  import re as _re
                  base = ("https://dallas.tx.publicsearch.us/results?department=RP"
                          "&recordedDateRange=20260602,20260602&searchType=quickSearch"
                          "&keywordSearch=false&searchOcrText=false")
                  prev_first = None
                  for pnum in range(1, 6):
                      page.goto(f"{base}&page={pnum}", wait_until="domcontentloaded", timeout=45000)
                      time.sleep(7)
                      try: page.wait_for_load_state("networkidle", timeout=10000)
                      except Exception: pass
                      # parse via the harvester regex
                      el = page.query_selector("table")
                      txt = el.inner_text() if el else page.inner_text("body")
                      docs = _re.findall(r"\b(20\d{10})\b", txt)
                      first = docs[0] if docs else None
                      advanced = (first != prev_first)
                      prev_first = first
                      print(f"PAGE {pnum}: rows~{len(docs)} first_doc={first} advanced={advanced}")
                      # show the column header + first row once
                      if pnum == 1:
                          mi = txt.find("DOC TYPE")
                          print("  HEADERROW:", txt[mi:mi+200].replace(chr(10)," ") if mi>=0 else txt[:200].replace(chr(10)," "))
              except Exception as e:
                  print("search err:", e)

              b.close()

          print("=== API CALLS ===")
          for c in api_calls[-25:]:
              print(c["status"], c["url"])
              if c["body"] and c["body"] != "<binary>":
                  print("   BODY:", c["body"][:400].replace("\n"," "))
          PYEOF
          python cap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dallas-search
          path: "*.png"
          if-no-files-found: ignore
